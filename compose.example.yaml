# Example deployment of jmap-apns-relay.
#
#   cp compose.example.yaml compose.yaml   # then edit the APNS_* values
#   ./scripts/gen-dev-certs.sh             # or drop your own TLS cert in ./secrets
#   docker compose up -d
#
# Put the TLS cert/key and the APNs .p8 in ./secrets (gitignored).
services:
  relay:
    image: dvselas/jmap-apns-relay:0.2.0
    # To build from source instead of pulling, comment `image:` and use:
    # build: .
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      PORT: "8443"
      TLS_CERT: /secrets/tls.crt
      TLS_KEY: /secrets/tls.key
      STATE_PATH: /state/relay.json
      # Production fails startup unless auth and complete APNs credentials are
      # valid. Use "development" explicitly for the log sender + poll endpoint.
      RELAY_MODE: production
      # Shared bearer token for /v1/register and /v1/pending. Without it the
      # registry is open: anyone who can reach the relay can claim a device id,
      # or re-point an existing one at their own APNs token and take over its
      # notifications. Production mode refuses to start when this is unset.
      RELAY_AUTH_TOKEN: "change-me"
      # --- APNs (required in production; omit all four only in development) ---
      APNS_KEY_PATH: /secrets/AuthKey.p8
      APNS_KEY_ID: "XXXXXXXXXX"
      APNS_TEAM_ID: "XXXXXXXXXX"
      APNS_TOPIC: "com.example.app"
      APNS_ENVIRONMENT: "sandbox"   # dev/TestFlight builds; omit for production
      # APNS_ALERT_TITLE: "Mail"
      # APNS_ALERT_BODY: "New mail"
    volumes:
      - ./secrets:/secrets:ro
      - ./state:/state
